name: Publish release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - package.json
      - .github/workflows/release.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          title="Fredy AI Application Tracking $version"

          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease_flag=""
            if [[ "$version" == *-* ]]; then
              prerelease_flag="--prerelease"
            fi

            gh release create "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              $prerelease_flag
          fi

          # Load the current workflow and source from master. release_tag names the container
          # image only, so an older Git tag cannot make the workflow rebuild stale source.
          # This also advances the rolling production channel without moving old version tags.
          gh workflow run docker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f release_tag="$version"
